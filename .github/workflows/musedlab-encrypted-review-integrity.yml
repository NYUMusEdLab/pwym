name: MusEDLab encrypted review policy
on:
  pull_request:
    branches: [gh-pages]
  merge_group:
    branches: [gh-pages]
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-review-integrity:
    name: MusEDLab encrypted review integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the proposed release
        # actions/checkout v4.2.2, same pinned commit as the inherited release policy.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Self-test the encrypted review policy
        run: python3 -B -m unittest discover -s scripts -p 'test_playable_score_release.py'
      - name: Verify the proposed encrypted review
        run: python3 -B scripts/check_playable_score_release.py
